# ============================================================
# AutoTestHub CI/CD 流水线（生产环境部署版）
# ============================================================

stages:
  - build
  - deploy

backend-compile:
  stage: build
  script:
    - cd backend
    - python3 -m compileall -q app
    - echo "backend compile OK"

frontend-build:
  stage: build
  script:
    - cd frontend
    - npm install --no-audit --no-fund --legacy-peer-deps
    - npm run build
  artifacts:
    paths:
      - frontend/dist
    expire_in: 1 week

deploy-to-server:
  stage: deploy
  only:
    - main
    - master
  script:
    - echo "Deploying AutoTestHub to local Docker environment..."
    - mkdir -p ./data
    - docker compose down --remove-orphans
    - docker compose up -d --build
    - echo "Deployment completed successfully!"
