# ============================================================
# AutoTestHub CI/CD 流水线（分支策略 + MR 本地部署测试版）
#
# 分支模型（2 条长期分支 + 短期 feature 分支；dev 可选）：
#   feature/* --MR--> master ：scan→unit-test(+覆盖率)→build→deploy(本地 WSL docker)→test
#                              全绿后 MR 显示 ✅，测过 + owner 才能合入（合并门禁见文档第六节）
#   master  --(合入后)         ：同上全流程做回归（部署到本地 CI 实例，不碰线上）
#   release/* --(每周从 master 拉)：build→deploy(线上 120.79.207.52)→test，给出报告
#   dev     --(可选)           ：scan→unit-test→build 快速反馈
#
# Runner 路由（可配置）：改 .linux-node / .windows-node 的 tags 即可整体迁移节点。
#   .linux-node   = WSL Runner（python3/node/docker/rsync/ssh）→ 扫描/编译/本地&线上部署/接口测试
#   .windows-node = Windows Runner（本机 python311）          → 单元测试 / autotestrunner 自动化测试
#
# 本地部署实例：WSL docker compose，项目名 autotesthub-ci，端口 15373（与本地已有 15173 实例隔离）
# ============================================================

stages:
  - scan
  - unit-test
  - build
  - deploy
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'     # 允许创建或更新 MR 时自动运行
    - if: '$CI_COMMIT_BRANCH == "master"'                    # 允许 master 合入/提交运行
    - if: '$CI_COMMIT_BRANCH =~ /^release/'                  # 允许 release 发布运行
    - when: never                                            # 其它日常的普通分支 push 不触发流水线

variables:
  GIT_DEPTH: "0"     # 完整历史，便于 MR 合并目标分支测"预合并结果"

# MR 场景下，把目标分支合进当前工作区，让编译/测试针对"预合并结果"（贴近 EE 的 Merged Results）
# 非 MR（master/release 等）不做任何事。冲突即失败，提示先解决。
.merge-target-sh: &merge-target-sh
  - 'if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then echo "🔀 MR：合并目标分支 origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME（测试预合并结果）" && git fetch -q origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" && git -c user.email=ci@ci -c user.name=ci merge --no-edit FETCH_HEAD || { echo "❌ 与目标分支存在冲突，请先解决再合入"; exit 1; }; fi'

# ---------- 可配置的 Runner 节点 ----------
.linux-node:
  tags: [wsl]
.windows-node:
  tags: [windows]

# ---------- 可复用触发规则 ----------
.rules-scan: &rules-scan                  # MR / master / dev
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH == "master"'
  - if: '$CI_COMMIT_BRANCH == "dev"'

.rules-build: &rules-build                # MR / master / dev / release
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH == "master"'
  - if: '$CI_COMMIT_BRANCH == "dev"'
  - if: '$CI_COMMIT_BRANCH =~ /^release/'

.rules-local: &rules-local                # MR / master（本地部署+测试+清理）
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH == "master"'

.rules-test: &rules-test                  # MR / master / release（autotestrunner）
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH == "master"'
  - if: '$CI_COMMIT_BRANCH =~ /^release/'

.rules-prod: &rules-prod                  # 仅 release（线上发布）
  - if: '$CI_COMMIT_BRANCH =~ /^release/'

# 本地 CI 实例的隔离参数（部署/清理共用）
.ci-instance: &ci-instance
  COMPOSE_PROJECT_NAME: autotesthub-ci
  FRONTEND_PORT: "15373"

# ============================================================
# 1. 代码扫描 + 质量门禁（门槛先放低）
# ============================================================
sast-bandit:
  stage: scan
  extends: [.linux-node]
  rules: *rules-scan
  before_script: *merge-target-sh
  script:
    - python3 -m pip install --quiet --user bandit || python3 -m pip install --quiet --user --break-system-packages bandit
    - mkdir -p scan-reports
    - python3 -m bandit -r backend/app -f txt -o scan-reports/bandit-full.txt || true
    - python3 -m bandit -r backend/app -f json -o scan-reports/bandit-full.json || true
    - python3 -m bandit -r backend/app -ll       # 仅 MEDIUM+ 阻断
  artifacts:
    when: always
    paths: [scan-reports/]
    expire_in: 1 week

typecheck-frontend:
  stage: scan
  extends: [.linux-node]
  rules: *rules-scan
  allow_failure: true
  script:
    - cd frontend
    - npm install --no-audit --no-fund --legacy-peer-deps
    - npx --yes tsc --noEmit

# ============================================================
# 2. 单元测试 + 覆盖率（Windows / python311）
# ============================================================
unit-test-backend:
  stage: unit-test
  extends: [.windows-node]
  rules: *rules-scan
  variables:
    PY: "D:\\dev\\testcode\\python311\\python.exe"
  before_script:
    - 'if ($env:CI_PIPELINE_SOURCE -eq "merge_request_event") { git fetch -q origin $env:CI_MERGE_REQUEST_TARGET_BRANCH_NAME; git -c user.email=ci@ci -c user.name=ci merge --no-edit FETCH_HEAD; if ($LASTEXITCODE -ne 0) { throw "merge conflict with target" } }'
  script:
    - $ErrorActionPreference = "Stop"
    - Set-Location backend
    - '& $env:PY -m pip install --quiet pytest pytest-cov pydantic-settings --disable-pip-version-check'
    - '& $env:PY -m pytest tests -q --cov=app --cov-report=term --cov-report=xml:$env:CI_PROJECT_DIR\coverage.xml --junitxml=$env:CI_PROJECT_DIR\unit-report.xml'
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'
  artifacts:
    when: always
    reports:
      junit: unit-report.xml
    paths: [unit-report.xml, coverage.xml]
    expire_in: 1 week

# ============================================================
# 3. 编译构建
# ============================================================
backend-compile:
  stage: build
  extends: [.linux-node]
  rules: *rules-build
  before_script: *merge-target-sh
  script:
    - cd backend
    - python3 -m compileall -q app
    - echo "backend compile OK"

frontend-build:
  stage: build
  extends: [.linux-node]
  rules: *rules-build
  before_script: *merge-target-sh
  script:
    - cd frontend
    - npm install --no-audit --no-fund --legacy-peer-deps
    - npm run build
  artifacts:
    paths: [frontend/dist]
    expire_in: 1 week

# ============================================================
# 4. 部署
# ============================================================
# 4a. MR/master：部署到本地 WSL docker（隔离实例，跑完即焚）
deploy-local:
  stage: deploy
  extends: [.linux-node]
  rules: *rules-local
  dependencies: [frontend-build]      # 取 frontend/dist 供镜像构建
  variables:
    <<: *ci-instance
  before_script: *merge-target-sh
  script:
    - docker compose up -d --build
    - docker compose ps

# 4b. release：部署到线上服务器
deploy-to-server:
  stage: deploy
  extends: [.linux-node]
  rules: *rules-prod
  dependencies: [frontend-build]
  before_script:
    - eval $(ssh-agent -s)
    - 'if [ -f "$SSH_PRIVATE_KEY" ]; then chmod 400 "$SSH_PRIVATE_KEY" && ssh-add "$SSH_PRIVATE_KEY" > /dev/null; else echo "$SSH_PRIVATE_KEY" | tr -d "\r" | ssh-add - > /dev/null; fi'
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Deploying release to $DEPLOY_HOST ..."
    - ssh $DEPLOY_USER@$DEPLOY_HOST "mkdir -p /opt/autotesthub"
    - rsync -avz --delete --exclude '.git/' --exclude 'frontend/node_modules/' --exclude 'backend/venv/' --exclude 'data/' ./ $DEPLOY_USER@$DEPLOY_HOST:/opt/autotesthub/
    - ssh $DEPLOY_USER@$DEPLOY_HOST "cd /opt/autotesthub && docker compose down --remove-orphans && docker compose up -d --build && docker compose ps"
    - 'echo "Deployed: http://$DEPLOY_HOST:15173"'

# ============================================================
# 5. 测试
# ============================================================
# 5a. MR/master：对本地实例做接口冒烟
app-smoke-test:
  stage: test
  extends: [.linux-node]
  rules: *rules-local
  variables:
    <<: *ci-instance
  script:
    - echo "等待本地实例就绪..."
    - for i in $(seq 1 20); do curl -fsS "http://localhost:$FRONTEND_PORT/" >/dev/null 2>&1 && break || sleep 3; done
    - curl -fsS "http://localhost:$FRONTEND_PORT/" >/dev/null && echo "前端可访问 OK"
    - 'curl -fsS "http://localhost:$FRONTEND_PORT/api/defects" >/dev/null && echo "后端 /api 可访问 OK" || echo "WARN: /api 冒烟未通过(接口可能需鉴权/数据，先不阻断)"'

# 5b. MR/master/release：autotestrunner demo plan（Windows）
autotestrunner-demo:
  stage: test
  extends: [.windows-node]
  rules: *rules-test
  variables:
    PY: "D:\\dev\\testcode\\python311\\python.exe"
    RUNNER_DIR: "D:\\dev\\testcode\\AutoTestRunner"
  script:
    - $ErrorActionPreference = "Stop"
    - Set-Location $env:RUNNER_DIR
    - '& $env:PY -m pip install -e . -q --disable-pip-version-check'
    - '& $env:PY -m autotest_runner run -plan examples/plan.yaml'
    - 'if ($LASTEXITCODE -ne 0) { throw "autotestrunner demo plan failed (exit $LASTEXITCODE)" }'
  after_script:
    - New-Item -ItemType Directory -Force "$env:CI_PROJECT_DIR\test-reports" | Out-Null
    - Copy-Item "$env:RUNNER_DIR\reports\local\*.html" "$env:CI_PROJECT_DIR\test-reports\" -Force -ErrorAction SilentlyContinue
  artifacts:
    when: always
    paths: [test-reports/]
    expire_in: 1 week

# ============================================================
# 6. 清理本地实例（无论成败都执行）
# ============================================================
cleanup-local:
  stage: .post
  extends: [.linux-node]
  variables:
    <<: *ci-instance
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: always
  script:
    - docker compose down -v --remove-orphans || true

# ============================================================
# 7. 汇总结果 → 上传 AutoTestHub 云端 /reports + 飞书通知（无论成败都执行）
# ============================================================
report-notify:
  stage: .post
  extends: [.linux-node]
  variables:
    HUB_URL: "http://120.79.207.52:15173"
  rules:
    - when: always
  script:
    - python3 ci/report_notify.py
