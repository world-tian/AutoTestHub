# ============================================================
# AutoTestHub CI 流水线
#
# 当前阶段：仅用 Windows Runner（executor = shell, powershell）跑通整条流程。
#   - 后续规划：编译/构建交给 WSL Runner，测试留在 Windows Runner，
#     通过 tags 路由（WSL prepare 问题修好后再接入）。
#
# Windows 注意：用 python（不是 python3）。
# ============================================================

stages:
  - build
  - test

# ---------- 后端：Python 语法/编译检查 ----------
backend-compile:
  stage: build
  script:
    - cd backend
    - python -m compileall -q app
    - echo "backend compile OK"

# ---------- 环境自检：证明 Runner 能跑测试环境 ----------
test-env:
  stage: test
  script:
    - python --version
    - node --version
    - echo "test runner ready"
