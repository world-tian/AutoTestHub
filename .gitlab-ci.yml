# ============================================================
# AutoTestHub CI/CD 流水线（分支策略 + MR 本地部署测试版）
#
# 分支模型（2 条长期分支 + 短期 feature 分支；dev 可选）：
#   feature/* --MR--> master ：scan→unit-test→build→deploy(本地 WSL docker)→test（合入前全套门禁）
#                              全绿后 MR 显示 ✅，测过 + owner 才能合入
#   master  --(合入后·持续部署)：build→deploy(生产 120.79.207.52)→冒烟→通知（不重复跑测试，MR 已测过）
#   release/* --(版本发布)     ：build→deploy(生产)→冒烟→autotestrunner→通知
#   dev     --(可选)           ：scan→unit-test→build 快速反馈
#
# Runner 路由（可配置）：改 .linux-node / .windows-node 的 tags 即可整体迁移节点。
#   .linux-node   = WSL Runner（python3/node/docker/rsync/ssh）→ 扫描/编译/本地&线上部署/接口测试
#   .windows-node = Windows Runner（本机 python311）          → 单元测试 / autotestrunner 自动化测试
#
# 本地部署实例：WSL docker compose，项目名 autotesthub-ci，端口 15373（与本地已有 15173 实例隔离）
# ============================================================

stages:
  - scan
  - unit-test
  - build
  - package
  - deploy
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'     # 允许创建或更新 MR 时自动运行
    - if: '$CI_COMMIT_BRANCH == "master"'                    # 允许 master 合入/提交运行
    - if: '$CI_COMMIT_BRANCH =~ /^release/'                  # 允许 release 发布运行
    - when: never                                            # 其它日常的普通分支 push 不触发流水线

variables:
  GIT_DEPTH: "0"     # 完整历史，便于 MR 合并目标分支测"预合并结果"

# MR 场景下，把目标分支合进当前工作区，让编译/测试针对"预合并结果"（贴近 EE 的 Merged Results）
# 非 MR（master/release 等）不做任何事。冲突即失败，提示先解决。
.merge-target-sh: &merge-target-sh
  - 'if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then echo "🔀 MR：合并目标分支 origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME（测试预合并结果）" && git fetch -q origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" && git -c user.email=ci@ci -c user.name=ci merge --no-edit FETCH_HEAD || { echo "❌ 与目标分支存在冲突，请先解决再合入"; exit 1; }; fi'

# ---------- 可配置的 Runner 节点 ----------
.linux-node:
  tags: [wsl]
.windows-node:
  tags: [windows]

# ---------- 可复用触发规则 ----------
.rules-scan: &rules-scan                  # MR / dev（master 合入后不重复扫描/单测）
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH == "dev"'

.rules-build: &rules-build                # MR / master / dev / release（master 排除定时触发）
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'
  - if: '$CI_COMMIT_BRANCH == "dev"'
  - if: '$CI_COMMIT_BRANCH =~ /^release/'

.rules-local: &rules-local                # 仅 MR（本地部署+冒烟+清理，做合入前门禁）
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.rules-test: &rules-test                  # MR / release（autotestrunner；master 合入后不重复跑）
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH =~ /^release/'

.rules-prod: &rules-prod                  # master（持续部署）+ release（版本发布）→ 生产
  - if: '$CI_COMMIT_BRANCH == "master"'
  - if: '$CI_COMMIT_BRANCH =~ /^release/'

# 本地 CI 实例的隔离参数（部署/清理共用）
.ci-instance: &ci-instance
  COMPOSE_PROJECT_NAME: autotesthub-ci
  FRONTEND_PORT: "15373"

# ============================================================
# 0. 定时任务（GitLab Pipeline Schedules 触发，在 master 上跑）
#    在 Settings→CI/CD→Pipeline schedules 建两个计划，分别设变量 SCHEDULE_TASK=cut / cleanup
#    需 CI 变量 GIT_WRITE_TOKEN（项目访问令牌：api + write_repository，maintainer）
# ============================================================
# 每周拉一条按时间命名的 release 分支 → 自动触发版本发布流水线
cut-weekly-release:
  stage: scan
  extends: [.linux-node]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TASK == "cut"'
  script:
    - 'BR="release/$(date +%Y-%m-%d-%H%M)"'
    - echo "拉取本周 release 分支：$BR"
    - 'curl --fail -sS -X POST -H "PRIVATE-TOKEN: $GIT_WRITE_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/branches?branch=$BR&ref=master" >/dev/null'
    - 'echo "✅ 已创建 $BR，将自动触发：编译→出包→部署预发布→测试→报告"'

# 清理 N 周前【按时间命名】的 release 分支（语义正式版本不动）
cleanup-old-releases:
  stage: scan
  extends: [.linux-node]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TASK == "cleanup"'
  variables:
    KEEP_WEEKS: "8"
  script:
    - python3 ci/cleanup_releases.py

# ============================================================
# 1. 代码扫描 + 质量门禁（门槛先放低）
# ============================================================
sast-bandit:
  stage: scan
  extends: [.linux-node]
  rules: *rules-scan
  before_script: *merge-target-sh
  script:
    - python3 -m pip install --quiet --user bandit || python3 -m pip install --quiet --user --break-system-packages bandit
    - mkdir -p scan-reports
    - python3 -m bandit -r backend/app -f txt -o scan-reports/bandit-full.txt || true
    - python3 -m bandit -r backend/app -f json -o scan-reports/bandit-full.json || true
    - python3 -m bandit -r backend/app -ll       # 仅 MEDIUM+ 阻断
  artifacts:
    when: always
    paths: [scan-reports/]
    expire_in: 1 week

typecheck-frontend:
  stage: scan
  extends: [.linux-node]
  rules: *rules-scan
  allow_failure: true
  script:
    - cd frontend
    - npm install --no-audit --no-fund --legacy-peer-deps
    - npx --yes tsc --noEmit

# ============================================================
# 2. 单元测试 + 覆盖率（Windows / python311）
# ============================================================
unit-test-backend:
  stage: unit-test
  extends: [.windows-node]
  rules: *rules-scan
  variables:
    PY: "D:\\dev\\testcode\\python311\\python.exe"
  before_script:
    - 'if ($env:CI_PIPELINE_SOURCE -eq "merge_request_event") { git fetch -q origin $env:CI_MERGE_REQUEST_TARGET_BRANCH_NAME; git -c user.email=ci@ci -c user.name=ci merge --no-edit FETCH_HEAD; if ($LASTEXITCODE -ne 0) { throw "merge conflict with target" } }'
  script:
    - $ErrorActionPreference = "Stop"
    - Set-Location backend
    - '& $env:PY -m pip install --quiet pytest pytest-cov pydantic-settings --disable-pip-version-check'
    - '& $env:PY -m pytest tests -q --cov=app --cov-report=term --cov-report=xml:$env:CI_PROJECT_DIR\coverage.xml --junitxml=$env:CI_PROJECT_DIR\unit-report.xml'
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'
  artifacts:
    when: always
    reports:
      junit: unit-report.xml
    paths: [unit-report.xml, coverage.xml]
    expire_in: 1 week

# ============================================================
# 3. 编译构建
# ============================================================
backend-compile:
  stage: build
  extends: [.linux-node]
  rules: *rules-build
  before_script: *merge-target-sh
  script:
    - cd backend
    - python3 -m compileall -q app
    - echo "backend compile OK"

frontend-build:
  stage: build
  extends: [.linux-node]
  rules: *rules-build
  before_script: *merge-target-sh
  script:
    - cd frontend
    - npm install --no-audit --no-fund --legacy-peer-deps
    - npm run build
  artifacts:
    paths: [frontend/dist]
    expire_in: 1 week

# ============================================================
# 3b. 出包（仅 release/* 分支）：打出带版本号的发布包
#     版本号 = 分支名去掉 release/ 前缀（按时间命名，如 release/2026-06-24-1430 → 2026-06-24-1430）
# ============================================================
package-release:
  stage: package
  extends: [.linux-node]
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release/'
  dependencies: [frontend-build]      # 取已编译的 frontend/dist
  script:
    - 'VERSION="${CI_COMMIT_REF_NAME#release/}"'
    - echo "📦 出包 $VERSION（commit $CI_COMMIT_SHORT_SHA, 构建时间 $(date -u +%FT%TZ)）"
    - mkdir -p dist-pkg
    - tar czf "dist-pkg/autotesthub-${VERSION}.tar.gz" --exclude='.git' --exclude='frontend/node_modules' --exclude='backend/venv' --exclude='dist-pkg' frontend/dist backend docker-compose.yml
    - 'printf "version: %s\ncommit:  %s\nbuilt:   %s\n" "$VERSION" "$CI_COMMIT_SHA" "$(date -u +%FT%TZ)" > dist-pkg/VERSION.txt'
    - ls -lh dist-pkg/
  artifacts:
    name: "autotesthub-${CI_COMMIT_REF_NAME}"
    paths: [dist-pkg/]
    expire_in: 3 months

# ============================================================
# 4. 部署
# ============================================================
# 4a. MR/master：部署到本地 WSL docker（隔离实例，跑完即焚）
deploy-local:
  stage: deploy
  extends: [.linux-node]
  rules: *rules-local
  dependencies: [frontend-build]      # 取 frontend/dist 供镜像构建
  variables:
    <<: *ci-instance
  before_script: *merge-target-sh
  script:
    - docker compose up -d --build
    - docker compose ps

# 4b. 部署到服务器：master→生产(15173)；release→独立预发布环境(15273)
#     同机不同 compose 项目名 + 端口 + 目录，互相隔离，各自独立 DB 卷
deploy-to-server:
  stage: deploy
  extends: [.linux-node]
  dependencies: [frontend-build]
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'
      variables:
        DEPLOY_DIR: "/opt/autotesthub"
        COMPOSE_PROJECT: "autotesthub"
        DEPLOY_PORT: "15173"
        ENV_NAME: "生产 production"
    - if: '$CI_COMMIT_BRANCH =~ /^release/'
      variables:
        DEPLOY_DIR: "/opt/autotesthub-release"
        COMPOSE_PROJECT: "autotesthub-release"
        DEPLOY_PORT: "15273"
        ENV_NAME: "预发布 release"
  before_script:
    # 受保护变量缺失早失败（非保护分支拿不到 → 给出清晰提示，而非诡异的 ssh-keyscan 报错）
    - 'for v in SSH_PRIVATE_KEY DEPLOY_HOST DEPLOY_USER; do eval "x=\$$v"; [ -n "$x" ] || { echo "❌ 变量 $v 为空：该分支可能未受保护，请把 release/* 设为 Protected（Settings→Repository→Protected branches）"; exit 1; }; done'
    - eval $(ssh-agent -s)
    - 'if [ -f "$SSH_PRIVATE_KEY" ]; then chmod 400 "$SSH_PRIVATE_KEY" && ssh-add "$SSH_PRIVATE_KEY" > /dev/null; else echo "$SSH_PRIVATE_KEY" | tr -d "\r" | ssh-add - > /dev/null; fi'
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
    - chmod 644 ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - echo "Deploying [$ENV_NAME] -> $DEPLOY_HOST:$DEPLOY_PORT ($CI_COMMIT_REF_NAME)"
    - ssh $DEPLOY_USER@$DEPLOY_HOST "mkdir -p $DEPLOY_DIR"
    - rsync -avz --delete --exclude '.git/' --exclude 'frontend/node_modules/' --exclude 'backend/venv/' --exclude 'data/' ./ $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/
    - ssh $DEPLOY_USER@$DEPLOY_HOST "cd $DEPLOY_DIR && COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT FRONTEND_PORT=$DEPLOY_PORT docker compose down --remove-orphans; COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT FRONTEND_PORT=$DEPLOY_PORT docker compose up -d --build && COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT docker compose ps"
    - 'echo "Deployed [$ENV_NAME]: http://$DEPLOY_HOST:$DEPLOY_PORT"'

# ============================================================
# 5. 测试
# ============================================================
# 5a. MR/master：对本地实例做接口冒烟
app-smoke-test:
  stage: test
  extends: [.linux-node]
  rules: *rules-local
  variables:
    <<: *ci-instance
  script:
    - echo "等待本地实例就绪..."
    - for i in $(seq 1 20); do curl -fsS "http://localhost:$FRONTEND_PORT/" >/dev/null 2>&1 && break || sleep 3; done
    - curl -fsS "http://localhost:$FRONTEND_PORT/" >/dev/null && echo "前端可访问 OK"
    - 'curl -fsS "http://localhost:$FRONTEND_PORT/api/defects" >/dev/null && echo "后端 /api 可访问 OK" || echo "WARN: /api 冒烟未通过(接口可能需鉴权/数据，先不阻断)"'

# 5b. 部署后对已部署环境做接口冒烟：master→生产(15173)；release→预发布(15273)
smoke-deployed:
  stage: test
  extends: [.linux-node]
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "schedule"'
      variables: { SMOKE_URL: "http://120.79.207.52:15173", ENV_NAME: "生产" }
    - if: '$CI_COMMIT_BRANCH =~ /^release/'
      variables: { SMOKE_URL: "http://120.79.207.52:15273", ENV_NAME: "预发布" }
  script:
    - echo "等待 [$ENV_NAME] 实例就绪..."
    - for i in $(seq 1 20); do curl -fsS "$SMOKE_URL/" >/dev/null 2>&1 && break || sleep 3; done
    - curl -fsS "$SMOKE_URL/" >/dev/null && echo "[$ENV_NAME] 前端可访问 OK"
    - 'curl -fsS "$SMOKE_URL/api/ci-reports" >/dev/null && echo "[$ENV_NAME] 后端 /api 可访问 OK" || echo "WARN: [$ENV_NAME] /api 冒烟未通过"'

# 5c. MR/release：autotestrunner demo plan（Windows）
autotestrunner-demo:
  stage: test
  extends: [.windows-node]
  rules: *rules-test
  variables:
    PY: "D:\\dev\\testcode\\python311\\python.exe"
    RUNNER_DIR: "D:\\dev\\testcode\\AutoTestRunner"
  script:
    - $ErrorActionPreference = "Stop"
    - Set-Location $env:RUNNER_DIR
    - '& $env:PY -m pip install -e . -q --disable-pip-version-check'
    - '& $env:PY -m autotest_runner run -plan examples/plan.yaml'
    - 'if ($LASTEXITCODE -ne 0) { throw "autotestrunner demo plan failed (exit $LASTEXITCODE)" }'
  after_script:
    - New-Item -ItemType Directory -Force "$env:CI_PROJECT_DIR\test-reports" | Out-Null
    - Copy-Item "$env:RUNNER_DIR\reports\local\*.html" "$env:CI_PROJECT_DIR\test-reports\" -Force -ErrorAction SilentlyContinue
  artifacts:
    when: always
    paths: [test-reports/]
    expire_in: 1 week

# ============================================================
# 6. 清理本地实例（无论成败都执行）
# ============================================================
cleanup-local:
  stage: .post
  extends: [.linux-node]
  variables:
    <<: *ci-instance
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
  script:
    - docker compose down -v --remove-orphans || true

# ============================================================
# 7. 汇总结果 → 上传 AutoTestHub 云端 /reports + 飞书通知（无论成败都执行）
# ============================================================
report-notify:
  stage: .post
  extends: [.linux-node]
  variables:
    HUB_URL: "http://120.79.207.52:15173"
  rules:
    - when: always
  script:
    - python3 ci/report_notify.py
