# ============================================================
# AutoTestHub CI/CD 流水线（生产环境部署版）
# ============================================================

stages:
  - build
  - deploy

backend-compile:
  stage: build
  script:
    - cd backend
    - python3 -m compileall -q app
    - echo "backend compile OK"

frontend-build:
  stage: build
  script:
    - cd frontend
    - npm install --no-audit --no-fund --legacy-peer-deps
    - npm run build
  artifacts:
    paths:
      - frontend/dist
    expire_in: 1 week

deploy-to-server:
  stage: deploy
  only:
    - main
    - master
  before_script:
    - eval $(ssh-agent -s)
    - |
      if [ -f "$SSH_PRIVATE_KEY" ]; then
        chmod 400 "$SSH_PRIVATE_KEY"
        ssh-add "$SSH_PRIVATE_KEY" > /dev/null
      else
        echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
      fi
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Syncing workspace files to remote GitLab server..."
    - ssh $DEPLOY_USER@$DEPLOY_HOST "mkdir -p /opt/autotesthub"
    - rsync -avz --delete --exclude '.git/' --exclude 'frontend/node_modules/' --exclude 'backend/venv/' ./ $DEPLOY_USER@$DEPLOY_HOST:/opt/autotesthub/
    - echo "Triggering remote docker-compose rebuild..."
    - ssh $DEPLOY_USER@$DEPLOY_HOST "cd /opt/autotesthub && docker compose down --remove-orphans && docker compose up -d --build"
    - echo "Deployment completed successfully!"
