version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - db-data:/app/data
    # 制品代理下载要从容器内访问宿主机上的 GitLab(80端口)：把域名解析到宿主机网关，
    # 绕开「容器访问本机公网IP的 hairpin NAT 不通」导致的连接超时。
    extra_hosts:
      - "gitlab.deeplore.cc:host-gateway"
    environment:
      - DATABASE_URL=sqlite:////app/data/autotesthub.db
      - FEISHU_APP_ID=${FEISHU_APP_ID}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET}
      - FEISHU_REDIRECT_URI=${FEISHU_REDIRECT_URI}
      - GITLAB_API_URL=${GITLAB_API_URL:-http://gitlab.deeplore.cc/api/v4}
      - GITLAB_API_TOKEN=${GITLAB_API_TOKEN:-}
      - GITLAB_PROJECT=${GITLAB_PROJECT:-liutong/autotesthub}
    command: sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    deploy:
      resources:
        limits:
          memory: 1G
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-15173}:80"
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always
    depends_on:
      - backend

volumes:
  db-data:
